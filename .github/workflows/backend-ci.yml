name: Backend CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Spring Boot backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: antiplagiat
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d antiplagiat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/antiplagiat
      DB_USERNAME: postgres
      DB_PASSWORD: password
      PG_URI: postgresql://postgres:password@localhost:5432/antiplagiat
      JWT_SECRET: ChangeThisJwtSecretKeyWithAtLeast32Characters2026
      ANALYSIS_USE_PADDLEOCR: "false"
      SPRING_FLYWAY_ENABLED: "true"
      JPA_DDL_AUTO: update

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/main/resources/python/requirements.txt

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
          tesseract --list-langs

      - name: Install Python analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/main/resources/python/requirements.txt

      - name: Validate Python analyzer syntax
        run: python -m py_compile src/main/resources/python/ai_analyzer.py

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run backend tests
        run: ./mvnw -q test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
