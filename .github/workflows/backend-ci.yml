name: Backend CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile Spring Boot backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: antiplagiat
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d antiplagiat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/antiplagiat
      DB_USERNAME: postgres
      DB_PASSWORD: password
      PG_URI: postgresql://postgres:password@localhost:5432/antiplagiat
      JWT_SECRET: ChangeThisJwtSecretKeyWithAtLeast32Characters2026
      ANALYSIS_USE_PADDLEOCR: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/main/resources/python/requirements.txt

      - name: Install lightweight Python checks dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install psycopg2-binary PyMuPDF

      - name: Enable pgvector extension
        run: |
          python - <<'PY'
          import psycopg2
          conn = psycopg2.connect("postgresql://postgres:password@localhost:5432/antiplagiat")
          conn.autocommit = True
          cur = conn.cursor()
          cur.execute("CREATE EXTENSION IF NOT EXISTS vector")
          cur.close()
          conn.close()
          PY

      - name: Validate Python analyzer syntax
        run: python -m py_compile src/main/resources/python/ai_analyzer.py

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Compile backend
        run: ./mvnw -q -DskipTests compile
