spring.application.name=antiplagiat

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/antiplagiat}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=${JWT_SECRET:ChangeThisJwtSecretKeyWithAtLeast32Characters2026}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.mail.enabled=false


spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.documents.storage-dir=uploads/documents
# 0 = ne pas stocker le contenu Base64 en base. Le fichier disque reste la source pour OCR/analyse/download.
app.documents.database-content-max-size-bytes=0
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# Python analyzer configuration
analysis.python.executable=${ANALYSIS_PYTHON_EXECUTABLE:python}
analysis.python.script=${ANALYSIS_PYTHON_SCRIPT:src/main/resources/python/ai_analyzer.py}
analysis.python.timeout.seconds=${ANALYSIS_PYTHON_TIMEOUT_SECONDS:900}
analysis.python.model=${ANALYSIS_PYTHON_MODEL:all-MiniLM-L6-v2}
analysis.text.max-chars=500000
analysis.ocr.min-text-length=80
analysis.ocr.max-pages=200
analysis.ocr.workers=4
# pgvector integration (optional)
analysis.pg.enabled=${ANALYSIS_PG_ENABLED:true}
analysis.pg.uri=${PG_URI:postgresql://postgres:password@localhost:5432/antiplagiat}
analysis.pg.table=${ANALYSIS_PG_TABLE:embeddings}
analysis.pg.chunk-max-chars=${ANALYSIS_PG_CHUNK_MAX_CHARS:1200}
analysis.pg.chunk-overlap-sentences=${ANALYSIS_PG_CHUNK_OVERLAP_SENTENCES:1}

